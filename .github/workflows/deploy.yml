name: Deploy (Directory + Docs)
on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build docs
        run: node packages/docs/src/cli/index.js build --input ./examples/petstore.yaml --output ./api-docs
      - name: Rebuild search index (lunr + Pagefind via Node API)
        run: node packages/docs/src/search/build-index.mjs ./api-docs
      - name: Build per-slug directory docs (openapiUrl entries)
        run: node packages/directory/scripts/build-docs.mjs
      - name: Build beautiful directory
        run: node packages/directory/scripts/build-web.mjs
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
